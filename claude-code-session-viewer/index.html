/* ---------- 轻量 Markdown 渲染 ---------- */
function md(src){
  if(src==null) return "";
  src=String(src);
  const blocks=[]; // 保护代码块
  src=src.replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>');
    return "␀"+(blocks.length-1)+"␀";
  });
  const lines=src.split("\n"); let out=[]; let i=0;
  function inline(t){
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
    t=t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,u)=>'<img alt="'+a+'" src="'+safeImg(u)+'">');
    t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,txt,u)=>'<a href="'+safeHref(u)+'" target="_blank" rel="noopener">'+txt+'</a>');
    t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/__([^_]+)__/g,'<b>$1</b>');
    t=t.replace(/(^|[^\w*])\*([^\s*][^*\n]*?[^\s*]|[^\s*])\*(?!\w)/g,'$1<i>$2</i>');
    return t;
  }
  while(i<lines.length){
    let ln=lines[i];
    if(/^␀\d+␀\s*$/.test(ln)){out.push(ln.trim());i++;continue;}
    if(/^\s*$/.test(ln)){i++;continue;}
    let h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
    if(/^\s*>\s?/.test(ln)){let b=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){b.push(inline(lines[i].replace(/^\s*>\s?/,'')));i++;}out.push('<blockquote>'+b.join('<br>')+'</blockquote>');continue;}
    if(/^\s*[-*+]\s+/.test(ln)){let b=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){b.push('<li>'+inline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>');i++;}out.push('<ul>'+b.join('')+'</ul>');continue;}
    if(/^\s*\d+\.\s+/.test(ln)){let b=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){b.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;}out.push('<ol>'+b.join('')+'</ol>');continue;}
    if(/^(\s*\|.*\|\s*)$/.test(ln)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let head=row(ln);i+=2;let body=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){body.push(row(lines[i]));i++;}
      let t='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      t+=body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      out.push(t);continue;
    }
    let para=[inline(ln)];i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,6}\s|>\s?|\s*[-*+]\s|\s*\d+\.\s|␀)/.test(lines[i])){para.push(inline(lines[i]));i++;}
    out.push('<p>'+para.join('<br>')+'</p>');
  }
  let html=out.join("\n");
  html=html.replace(/␀(\d+)␀/g,(m,n)=>blocks[+n]);
  return html;
}
const PLACEHOLDER_JS=1;
/* ---------- 时间 / 工具 ---------- */
const fmtTime=ts=>{if(!ts)return"";try{const d=new Date(ts);if(isNaN(d))return"";return d.toLocaleString(LANG==='zh'?'zh-CN':'en-US',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){return"";}};
const fmtDur=ms=>{if(ms==null)return"";const s=ms/1000;if(s<60)return s.toFixed(1)+'s';const m=Math.floor(s/60);return m+'m'+Math.round(s%60)+'s';};
const num=n=>n==null?"0":n.toLocaleString('en-US');

/* ---------- 解析 ---------- */
function parse(text){
  const entries=[]; let bad=0;
  const trimmed=(text||'').trim();
  // 兼容整段 JSON 数组 / 单个 JSON 对象（含多行美化格式）
  if(trimmed){
    try{
      const whole=JSON.parse(trimmed);
      if(Array.isArray(whole))return {entries:whole.filter(x=>x&&typeof x==='object'),bad:0};
      if(whole&&typeof whole==='object')return {entries:[whole],bad:0};
    }catch(e){/* 退回按行解析 */}
  }
  for(const raw of trimmed.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    try{entries.push(JSON.parse(line));}catch(e){bad++;}
  }
  return {entries,bad};
}
function summarize(entries){
  const s={title:"",sessionId:"",cwd:"",gitBranch:"",version:"",cost:null,
    counts:{user:0,assistant:0,tool:0,thinking:0,image:0}, firstTs:null,lastTs:null,models:new Set()};
  for(const o of entries){
    const t=o.type;
    if(t==='ai-title'&&o.aiTitle)s.title=o.aiTitle;
    if(o.sessionId&&!s.sessionId)s.sessionId=o.sessionId;
    if(o.cwd)s.cwd=o.cwd;
    if(o.gitBranch)s.gitBranch=o.gitBranch;
    if(o.version)s.version=o.version;
    if(t==='cost-state')s.cost=o;
    if(o.timestamp){if(!s.firstTs)s.firstTs=o.timestamp;s.lastTs=o.timestamp;}
    const msg=o.message;
    if(t==='user'&&isHumanPrompt(o))s.counts.user++;
    if(t==='assistant'&&msg){
      if(msg.model)s.models.add(msg.model);
      const c=msg.content;
      if(Array.isArray(c))for(const b of c){
        if(b.type==='tool_use')s.counts.tool++;
        else if(b.type==='thinking')s.counts.thinking++;
      }
      if(Array.isArray(c)&&c.some(b=>b.type==='text'||b.type==='thinking'||b.type==='tool_use'))s.counts.assistant++;
    }
    if(msg&&Array.isArray(msg.content))for(const b of msg.content)if(b.type==='image')s.counts.image++;
  }
  return s;
}
function isInjectedText(t){
  if(!t)return false;
  const s=String(t).trimStart();
  return /^<(system-reminder|command-name|command-message|command-args|local-command|task-notification|user-prompt-submit|caveat)/i.test(s)
    || s.startsWith('Base directory for this skill:')
    || s.startsWith('Caveat:')
    || s.startsWith('This session is being continued from a previous conversation')
    || /^\[Request interrupted/i.test(s);
}
// 把一条 user 条目分成三类：human（真实用户输入）/ toolresult / meta（系统注入等）
function classifyUser(o){
  if(o.type!=='user')return 'meta';
  const c=o.message&&o.message.content;
  if(Array.isArray(c)&&c.some(b=>b.type==='tool_result'))return 'toolresult';
  if(o.isMeta||o.isCompactSummary)return 'meta';
  // 字符串内容：除明确的系统消息/注入外，一律视为用户输入（fail-open）
  if(typeof c==='string'){
    if(o.promptSource==='system')return 'meta';
    if(isInjectedText(c))return 'meta';
    return c.trim()?'human':'meta';
  }
  if(Array.isArray(c)){
    const texts=c.filter(b=>b.type==='text'&&b.text&&b.text.trim());
    const hasImg=c.some(b=>b.type==='image');
    if(!texts.length&&!hasImg)return 'meta';
    // 明确的人类信号
    if((o.origin&&o.origin.kind==='human')||o.promptSource==='typed')return 'human';
    // 看起来像注入上下文的（技能/命令/提醒）归 meta，其余 fail-open 当作用户输入
    if(texts.length&&texts.every(b=>isInjectedText(b.text)))return 'meta';
    return 'human';
  }
  return 'meta';
}
function isHumanPrompt(o){return classifyUser(o)==='human';}
const PLACEHOLDER_RENDER=1;
/* ---------- 渲染单条 ---------- */
let EXPAND_ALL=false;
function toolArgPreview(name,input){
  if(!input||typeof input!=='object')return "";
  const keys=['file_path','path','command','pattern','url','prompt','query','description','skill','subagent_type','todos'];
  for(const k of keys){if(input[k]!=null){let v=input[k];if(typeof v!=='string')v=JSON.stringify(v);return v.length>120?v.slice(0,120)+'…':v;}}
  const ks=Object.keys(input);return ks.length?ks[0]+'='+String(input[ks[0]]).slice(0,80):"";
}
function collapsible(headHtml,bodyHtml,openByDefault,cls){
  const wrap=el('div',cls||'');
  const hd=el('div','hd',headHtml);
  const bd=el('div','bd'+((openByDefault||EXPAND_ALL)?'':' hidden'),bodyHtml);
  hd.onclick=()=>bd.classList.toggle('hidden');
  wrap.appendChild(hd);wrap.appendChild(bd);return wrap;
}
// 思考：标题行显示一行预览，可点击展开/收起全文
function renderThinking(text){
  const wrap=el('div','think');
  const full=String(text==null?'':text);
  const first=full.split('\n').map(s=>s.trim()).find(s=>s)||'';
  const prev=first.length>120?first.slice(0,120)+'…':first;
  const hd=el('div','hd');
  const label=el('span','tk-label');label.textContent=t('thinkLabel');
  const prevSpan=el('span','tk-prev');prevSpan.textContent=prev;
  const caret=el('span','caret');
  hd.appendChild(label);hd.appendChild(prevSpan);hd.appendChild(caret);
  const bd=el('div','bd'+(EXPAND_ALL?'':' hidden'));bd.style.whiteSpace='pre-wrap';bd.textContent=full;
  const sync=()=>{const open=!bd.classList.contains('hidden');caret.textContent=open?'▾':'▸';prevSpan.classList.toggle('hidden',open);};
  sync();
  hd.onclick=()=>{bd.classList.toggle('hidden');sync();};
  wrap.appendChild(hd);wrap.appendChild(bd);return wrap;
}
function imgEl(src){const im=el('img','inlimg');im.src=src;im.onclick=()=>window.open(src,'_blank');return im;}
function resultContent(content){
  const frag=document.createDocumentFragment();
  if(typeof content==='string'){frag.appendChild(el('pre',null,esc(content)));return frag;}
  if(Array.isArray(content)){
    for(const b of content){
      if(b.type==='text')frag.appendChild(el('pre',null,esc(b.text)));
      else if(b.type==='image'&&b.source){frag.appendChild(imgEl('data:'+b.source.media_type+';base64,'+b.source.data));}
      else frag.appendChild(el('pre',null,esc(JSON.stringify(b,null,2))));
    }
    return frag;
  }
  frag.appendChild(el('pre',null,esc(JSON.stringify(content,null,2))));return frag;
}
function renderToolUse(b){
  const card=el('div','tool');
  const open=EXPAND_ALL;
  const hd=el('div','hd');
  hd.innerHTML='<span class="tn">⏺ '+esc(b.name)+'</span><span class="ta">'+esc(toolArgPreview(b.name,b.input))+'</span><span class="caret">⋯</span>';
  const params=el('div','params'+(open?'':' hidden'));
  if(b.input&&typeof b.input==='object'){
    for(const [k,v] of Object.entries(b.input)){
      let vs=typeof v==='string'?v:JSON.stringify(v,null,2);
      const p=el('div','p');p.innerHTML='<span class="pk">'+esc(k)+'</span>: ';
      const pre=el('span','mono');pre.style.whiteSpace='pre-wrap';pre.style.wordBreak='break-word';pre.textContent=vs;
      p.appendChild(pre);params.appendChild(p);
    }
  }
  hd.onclick=()=>params.classList.toggle('hidden');
  card.appendChild(hd);card.appendChild(params);return card;
}
function renderToolResult(b){
  const isErr=b.is_error;
  const wrap=el('div','result'+(isErr?' err':''));
  let preview=t('viewResult');
  if(typeof b.content==='string'){const ln=b.content.split('\n').length;preview=(isErr?'❌ '+t('error'):'⎿ '+t('result'))+' · '+ln+' '+t('lines');}
  else if(Array.isArray(b.content)){const imgs=b.content.filter(x=>x.type==='image').length;preview=(isErr?'❌ '+t('error'):'⎿ '+t('result'))+(imgs?' · '+imgs+' '+t('images'):'');}
  const hd=el('div','hd',esc(preview)+' <span style="opacity:.6">▸</span>');
  const bd=el('div',EXPAND_ALL?'':'hidden');bd.appendChild(resultContent(b.content));
  hd.onclick=()=>bd.classList.toggle('hidden');
  wrap.appendChild(hd);wrap.appendChild(bd);return wrap;
}
const PLACEHOLDER_RENDER2=1;
/* ---------- 行容器 ---------- */
function turn(gutterChar,gutterCls,metaHtml,bodyNode,kindCls){
  const t=el('div','turn '+(kindCls||''));
  const row=el('div','row');
  row.appendChild(el('div','gutter '+(gutterCls||''),gutterChar||''));
  const body=el('div','body');
  if(metaHtml)body.appendChild(el('div','meta-line',metaHtml));
  body.appendChild(bodyNode);
  row.appendChild(body);t.appendChild(row);return t;
}
function metaLine(o){
  const parts=[];
  if(o.timestamp)parts.push(esc(fmtTime(o.timestamp)));
  if(o.message&&o.message.model)parts.push('<span class="badge">'+esc(o.message.model)+'</span>');
  if(o.isSidechain)parts.push('<span class="badge side">sidechain</span>');
  const u=o.message&&o.message.usage;
  if(u)parts.push('<span class="badge">in '+num(u.input_tokens)+' / out '+num(u.output_tokens)+'</span>');
  return parts.join(' ');
}
/* ---------- 把一条 entry 渲染进 stream ---------- */
// 一个 assistant 行是否该显示：有正文(text/image)则恒显示；否则取决于它含有的思考/工具是否被打开
function aturnVisible(solid,hasThink,hasTool){return solid||(hasThink&&SHOW_THINK)||(hasTool&&SHOW_TOOL);}
function renderEntry(o,stream){
  const ty=o.type, msg=o.message, content=msg&&msg.content;
  if(ty==='user'){
    const kind=classifyUser(o);
    if(kind==='human'){
      const box=el('div','bubble');
      if(typeof content==='string')box.textContent=content;
      else if(Array.isArray(content))for(const b of content){
        if(b.type==='text'){const d=el('div');d.textContent=b.text;box.appendChild(d);}
        else if(b.type==='image'&&b.source)box.appendChild(imgEl('data:'+b.source.media_type+';base64,'+b.source.data));
      }
      const meta='<span class="who">'+esc(t('you'))+'</span> '+metaLine(o);
      stream.appendChild(turn('&gt;','',meta,box,'user'));
      return;
    }
    // 工具结果
    if(kind==='toolresult'){
      for(const b of content)if(b.type==='tool_result'){const tr=turn('','',null,renderToolResult(b),'toolres');tr.dataset.tool='1';tr.classList.toggle('hidden',!SHOW_TOOL);stream.appendChild(tr);}
      return;
    }
    // 系统注入 / task-notification / meta
    let txt='';
    if(typeof content==='string')txt=content;
    else if(Array.isArray(content))txt=content.map(b=>b.text||JSON.stringify(b)).join('\n');
    const label=o.promptSource==='system'?t('sysMsg'):t('injCtx');
    const note=collapsible('▸ '+label+' <span style="opacity:.6">'+esc(fmtTime(o.timestamp))+'</span>','<pre>'+esc(txt)+'</pre>',false,'note');
    note.dataset.meta='1';note.classList.toggle('hidden',!SHOW_META);
    stream.appendChild(note);
    return;
  }
  if(ty==='assistant'&&typeof content==='string'&&content.trim()){
    const bub=el('div','reply');const d=el('div','md');d.innerHTML=md(content);bub.appendChild(d);
    stream.appendChild(turn('⏺','','<span class="who ai">'+esc(t('reply'))+'</span> '+metaLine(o),bub,'assistant'));
    return;
  }
  if(ty==='assistant'&&Array.isArray(content)){
    const body=el('div');let printed=false,hasSolid=false,hasThink=false,hasTool=false;
    for(const b of content){
      if(b.type==='text'&&b.text.trim()){const bub=el('div','reply');const d=el('div','md');d.innerHTML=md(b.text);bub.appendChild(d);body.appendChild(bub);printed=true;hasSolid=true;}
      else if(b.type==='thinking'){
        const tk=renderThinking(b.thinking);
        tk.dataset.think='1';tk.classList.toggle('hidden',!SHOW_THINK);body.appendChild(tk);printed=true;hasThink=true;
      }
      else if(b.type==='tool_use'){const tc=renderToolUse(b);tc.dataset.tool='1';tc.classList.toggle('hidden',!SHOW_TOOL);body.appendChild(tc);printed=true;hasTool=true;}
      else if(b.type==='image'&&b.source){body.appendChild(imgEl('data:'+b.source.media_type+';base64,'+b.source.data));printed=true;hasSolid=true;}
    }
    if(printed){
      const meta=hasSolid?('<span class="who ai">'+esc(t('reply'))+'</span> '+metaLine(o)):metaLine(o);
      const tn=turn('⏺','',meta,body,'assistant');
      tn.dataset.aturn='1';
      if(hasSolid)tn.dataset.solid='1';
      if(hasThink)tn.dataset.hasThink='1';
      if(hasTool)tn.dataset.hasTool='1';
      tn.classList.toggle('hidden',!aturnVisible(hasSolid,hasThink,hasTool));
      stream.appendChild(tn);
    }
    return;
  }
  if(ty==='system'){
    const txt=o.content||(o.subtype?('['+o.subtype+'] hooks: '+(o.hookInfos||[]).map(h=>h.command).join(', ')):JSON.stringify(o));
    const note=collapsible('▸ '+esc(t('system'))+' '+esc(o.subtype||'')+' <span style="opacity:.6">'+esc(fmtTime(o.timestamp))+'</span>','<pre>'+esc(txt)+'</pre>',false,'note');
    note.dataset.meta='1';note.classList.toggle('hidden',!SHOW_META);stream.appendChild(note);
    return;
  }
}
const PLACEHOLDER_MAIN=1;
/* ---------- 全局状态 & 主流程 ---------- */
let SHOW_THINK=true,SHOW_TOOL=true,SHOW_META=false,CUR=null;
function renderSidebar(sum,bad){
  const sb=$('#sidebar');sb.innerHTML='';
  sb.appendChild(el('h3',null,t('sessionInfo')));
  if(sum.title){const k=el('div','kv');k.innerHTML='<div class="k">'+esc(t('titleRow'))+'</div><div class="v">'+esc(sum.title)+'</div>';sb.appendChild(k);}
  const span=(sum.firstTs&&sum.lastTs)?fmtTime(sum.firstTs)+' → '+fmtTime(sum.lastTs):'';
  const rows=[[t('projectDir'),sum.cwd],[t('gitBranch'),sum.gitBranch],[t('version'),sum.version],[t('sessionId'),sum.sessionId],[t('time'),span],[t('model'),[...sum.models].join(', ')]];
  for(const [k,v] of rows){if(!v)continue;const d=el('div','kv');d.innerHTML='<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>';sb.appendChild(d);}
  sb.appendChild(el('h3',null,t('stats')));
  const g=el('div','stat-grid');
  const stats=[[t('userMsgs'),sum.counts.user],[t('replies'),sum.counts.assistant],[t('toolCalls'),sum.counts.tool],[t('thinkingStat'),sum.counts.thinking],[t('imagesStat'),sum.counts.image]];
  if(bad)stats.push([t('parseFailed'),bad]);
  for(const [l,n] of stats){const s=el('div','stat');s.innerHTML='<div class="n">'+n+'</div><div class="l">'+esc(l)+'</div>';g.appendChild(s);}
  sb.appendChild(g);
  if(sum.cost){
    sb.appendChild(el('h3',null,t('costUsage')));
    const c=sum.cost;
    const cost=c.totalCostUSD!=null?('$'+c.totalCostUSD.toFixed(4)):'';
    const crows=[[t('totalCost'),cost],[t('linesPM'),(c.totalLinesAdded||0)+' / -'+(c.totalLinesRemoved||0)],[t('apiTime'),fmtDur(c.totalAPIDuration)],[t('toolTime'),fmtDur(c.totalToolDuration)]];
    for(const [k,v] of crows){if(!v)continue;const d=el('div','kv');d.innerHTML='<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>';sb.appendChild(d);}
    if(c.modelUsage)for(const [m,u] of Object.entries(c.modelUsage)){const d=el('div','kv');d.innerHTML='<div class="k">'+esc(m)+'</div><div class="v">in '+num(u.inputTokens)+' · out '+num(u.outputTokens)+'</div>';sb.appendChild(d);}
  }
}
function renderAll(){
  if(!CUR)return;
  const stream=$('#stream');stream.innerHTML='';
  for(const o of CUR.entries)renderEntry(o,stream);
}
function load(text,name,pasted){
  const {entries,bad}=parse(text);
  const sum=summarize(entries);
  CUR={entries,bad,sum,name:name||'',pasted:!!pasted};
  applyFname();
  renderSidebar(sum,bad);
  renderAll();
  $('#drop').classList.add('hide');
}
// 当前内容的显示名（粘贴内容随语言切换）
function curName(){if(!CUR)return'';return CUR.pasted?t('pastedContent'):CUR.name;}
function applyFname(){
  const fn=$('#fname');const n=curName();
  if(fn)fn.textContent=n?('  ·  '+n):'';
  document.title=((CUR&&(CUR.sum.title||n))||'Claude Code')+' · '+t('viewerSuffix');
}
// 切换语言 / 重新渲染已加载内容
function rerender(){
  if(!CUR)return;
  renderSidebar(CUR.sum,CUR.bad);
  renderAll();
}
/* ---------- 交互 ---------- */
function applyToggles(){
  document.querySelectorAll('[data-think]').forEach(e=>e.classList.toggle('hidden',!SHOW_THINK));
  document.querySelectorAll('[data-tool]').forEach(e=>e.classList.toggle('hidden',!SHOW_TOOL));
  document.querySelectorAll('[data-meta]').forEach(e=>e.classList.toggle('hidden',!SHOW_META));
  // 若某条 assistant 行的内容（思考/工具）被整体隐藏且无正文，则连同时间/模型信息一起隐藏
  document.querySelectorAll('[data-aturn]').forEach(e=>{
    const vis=aturnVisible(e.dataset.solid==='1',e.dataset.hasThink==='1',e.dataset.hasTool==='1');
    e.classList.toggle('hidden',!vis);
  });
}
